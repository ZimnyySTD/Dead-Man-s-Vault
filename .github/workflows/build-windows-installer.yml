name: Build Windows Installer

on:
  push:
    branches: [ main, '**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies for Qt Offscreen
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./B2CHKS-1.0.0
          pip install -e .
          pip install pytest

      - name: Run Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -v tests/

  build-installer:
    name: Build Windows Executable & Installer
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller wheel
          pip install -e ./B2CHKS-1.0.0
          pip install -e .

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm deadmansvault.spec

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --yes --no-progress

      - name: Compile Windows Installer
        shell: powershell
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $candidates = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe",
              "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
            )
            foreach ($path in $candidates) {
              if (Test-Path $path) {
                $iscc = $path
                break
              }
            }
          } else {
            $iscc = $iscc.Source
          }
          if (-not $iscc) {
            throw "ISCC.exe not found on runner!"
          }
          Write-Host "Using ISCC at: $iscc"
          & $iscc installer.iss

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeadMansVault-Windows-Installer
          path: installer_output/*.exe
          if-no-files-found: error
          retention-days: 14
