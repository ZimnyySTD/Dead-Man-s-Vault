name: Build Windows Installer

on:
  push:
    branches: [ main, '**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies for Qt Offscreen
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./B2CHKS-1.0.0
          pip install -e .
          pip install pytest

      - name: Run Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -v tests/

  build-installer:
    name: Build Windows Executable & Installer
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller wheel
          pip install -e ./B2CHKS-1.0.0
          pip install -e .

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm deadmansvault.spec

      - name: Set up Inno Setup
        uses: Brahn/install-innosetup@v1.4.0
        with:
          version: '6.3.3'

      - name: Compile Windows Installer
        run: |
          iscc installer.iss

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeadMansVault-Windows-Installer
          path: installer_output/*.exe
          if-no-files-found: error
          retention-days: 14
